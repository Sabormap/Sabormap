// ============================================
// FUNCIONES AUXILIARES
// ============================================

// Función para imprimir en el log de la pantalla
function log(message, type = 'info') {
    const logDiv = document.getElementById('log');
    const time = new Date().toLocaleTimeString();
    logDiv.innerHTML += `<div class="${type}">[${time}] ${message}</div>`;
    logDiv.scrollTop = logDiv.scrollHeight; // Auto-scroll al último mensaje
}

// Función para actualizar los contadores
function updateStats(total, uploaded, errors) {
    document.getElementById('totalPlaces').textContent = total;
    document.getElementById('uploadedCount').textContent = uploaded;
    document.getElementById('errorCount').textContent = errors;
}

// ============================================
// FUNCIONES DE LOS BOTONES
// ============================================

// 1. Subir todos los lugares
async function startUpload() {
    const btnUpload = document.getElementById('btnUpload');
    btnUpload.disabled = true;
    
    const total = placesData.length;
    updateStats(total, 0, 0);
    
    if (total === 0) {
        log("No hay lugares en placesData para subir.", "error");
        btnUpload.disabled = false;
        return;
    }

    log(`Iniciando subida de ${total} lugar(es)...`, "info");

    // ============================================
    // TRANSFORMAR camelCase a snake_case
    // ============================================
    const formattedData = placesData.map(({ mapUrl, priceRange, ...rest }) => {
        const newItem = { ...rest };
        
        // Cambiamos mapUrl a map_url si existe
        if (mapUrl !== undefined) {
            newItem.map_url = mapUrl;
        }
        
        // Cambiamos priceRange a price_range si existe
        if (priceRange !== undefined) {
            newItem.price_range = priceRange;
        }

        return newItem;
    });

    // Insertamos el array transformado en Supabase
    const { data, error } = await supabase
        .from('places')
        .insert(formattedData);

    if (error) {
        log(`❌ Error al subir: ${error.message}`, "error");
        // Si hay error de clave duplicada (ya existe), lo indicamos
        if (error.code === '23505') {
            log("Detalles: Parece que algunos lugares ya existen en la base de datos (ID duplicado).", "error");
        }
        updateStats(total, 0, total);
    } else {
        log(`✅ ¡Éxito! ${total} lugar(es) subidos correctamente.`, "success");
        updateStats(total, total, 0);
    }

    btnUpload.disabled = false;
}

// 2. Verificar datos existentes
async function checkExisting() {
    log("Consultando base de datos...", "info");
    
    // Hacemos una consulta pidiendo solo el conteo, sin traer los datos pesados
    const { count, error } = await supabase
        .from('places')
        .select('*', { count: 'exact', head: true });

    if (error) {
        log(`❌ Error al consultar: ${error.message}`, "error");
        return;
    }

    log(`🔍 Actualmente hay ${count} lugar(es) registrados en Supabase.`, "success");
    document.getElementById('uploadedCount').textContent = count;
}

// 3. Borrar todos los lugares
async function clearAllPlaces() {
    // Pedimos confirmación para evitar borrados accidentales
    if (!confirm("⚠️ ¿Estás seguro de que quieres borrar TODOS los lugares de Supabase? Esta acción no se puede deshacer.")) {
        return;
    }

    log("Borrando todos los lugares de la base de datos...", "info");

    // Al pasar un filtro que cumple todo (id > 0), borramos toda la tabla
    const { error } = await supabase
        .from('places')
        .delete()
        .gt('id', 0); // gt = greater than (Mayor que 0, asumiendo que los IDs son numéricos positivos)

    if (error) {
        log(`❌ Error al borrar: ${error.message}`, "error");
    } else {
        log("🗑️ Todos los lugares han sido borrados exitosamente.", "success");
        updateStats(placesData.length, 0, 0);
    }
}

// Inicializamos el contador local al cargar la página
updateStats(placesData.length, 0, 0);
log("Sistema listo. Añade tus lugares al array placesData y pulsa 'Subir'.", "info");
